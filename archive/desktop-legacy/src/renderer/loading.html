<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file: data:">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --fg: #1f2328;
      --fg-dim: #57606a;
      --box-bg: #ffffff;
      --box-border: #d0d7de;
      --box-text: #24292f;
      --accent: #4d9fff;
      --spinner-track: #d0d7de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --fg: #c9d1d9;
        --fg-dim: #8b949e;
        --box-bg: #161b22;
        --box-border: #2b3138;
        --box-text: #c9d1d9;
        --spinner-track: #2b3138;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
      /* 内容合成后淡入：加载页从纯底色平滑显现，遮住合成间隙 */
      animation: fadein 50ms ease-out;
    }
    @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
    .icon-wrap {
      position: relative;
      width: 180px;
      height: 180px;
    }
    .whale {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: float 2.4s ease-in-out infinite;
      filter: drop-shadow(0 10px 28px rgba(77, 159, 255, 0.35));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .label { font-size: 15px; letter-spacing: 0.02em; color: var(--fg-dim); }
    .log {
      width: min(720px, 86vw);
      height: 220px;
      box-sizing: border-box;
      border: 1px solid var(--box-border);
      border-radius: 10px;
      background: var(--box-bg);
      color: var(--box-text);
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 12px 14px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }
  </style>
</head>
<body>
  <div class="icon-wrap">
    <img class="whale" src="../../assets/icon.png" alt="">
  </div>
  <div class="label">DeepSeek Harness 正在启动…</div>
  <div class="log" id="log"></div>
  <script>
    const box = document.getElementById('log')
    function append(line) {
      const div = document.createElement('div')
      div.textContent = line
      box.appendChild(div)
      box.scrollTop = box.scrollHeight
    }
    if (window.desktop && window.desktop.onLog) {
      window.desktop.onLog(append)
    }
  </script>
</body>
</html>
